version: 0.1
frontend:
  phases:
    preBuild:
      commands:
        # The build image has no nvm; install Node 24 LTS directly
        - curl -fsSL https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o /tmp/node.tar.xz
        - mkdir -p /tmp/node && tar -xJf /tmp/node.tar.xz -C /tmp/node --strip-components=1
        - export PATH=/tmp/node/bin:$PATH
        - node --version
        - npm ci
    build:
      commands:
        - export PATH=/tmp/node/bin:$PATH
        - npm run build
  artifacts:
    baseDirectory: public
    files:
      - "**/*"
  cache:
    paths:
      - .cache/**/*
      - ~/.npm/**/*
